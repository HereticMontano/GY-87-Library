; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examplesF
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = uno_r4_wifi

[env:uno_r4_wifi]
platform = renesas-ra
board = uno_r4_wifi
framework = arduino
monitor_speed = 9600
extra_scripts = pre:enter_bootloader.py
debug_build_flags = -O0 -g3 -ggdb

[env:uno_r4_minima]
platform = renesas-ra
board = uno_r4_minima
framework = arduino

monitor_speed = 9600